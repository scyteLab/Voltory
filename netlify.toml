[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Node runtime for serverless functions
[functions]
  node_bundler = "esbuild"

# API routes for serverless functions — accessed at /api/*
# (Netlify auto-serves under /.netlify/functions/*; the rewrite
# below gives us cleaner URLs.)
[[redirects]]
  from = "/api/send-email"
  to   = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/paystack-verify"
  to   = "/.netlify/functions/paystack-verify"
  status = 200

[[redirects]]
  from = "/api/paystack-webhook"
  to   = "/.netlify/functions/paystack-webhook"
  status = 200

# SPA fallback — MUST be after the /api rewrites so it doesn't swallow
# API paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200