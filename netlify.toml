[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Node runtime for serverless functions
[functions]
  node_bundler = "esbuild"

# API routes for serverless functions — accessed at /api/*
# (Netlify auto-serves under /.netlify/functions/*; the rewrite
# below gives us cleaner URLs.)
#
# NOTE: public/_redirects (copied into dist/) is processed BEFORE these
# rules and has its own "/*" catch-all, so the same /api rules are
# listed there too, above that catch-all. Keep both files in sync.
# The browser calls /.netlify/functions/* directly so it never depends
# on these rewrites.
[[redirects]]
  from = "/api/send-email"
  to   = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/paystack-verify"
  to   = "/.netlify/functions/paystack-verify"
  status = 200

[[redirects]]
  from = "/api/paystack-webhook"
  to   = "/.netlify/functions/paystack-webhook"
  status = 200

[[redirects]]
  from = "/api/order-switch-pod"
  to   = "/.netlify/functions/order-switch-pod"
  status = 200

# SPA fallback — MUST be after the /api rewrites so it doesn't swallow
# API paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200